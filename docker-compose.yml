version: "3.9"

# ════════════════════════════════════════════════════════════════
# IT Maturity Assessment – Docker Compose (local development)
# ════════════════════════════════════════════════════════════════
#
# Usage:
#   cp .env.example .env          # edit .env with your API keys
#   docker compose up --build     # starts all services
#   # App available at: http://localhost:8000
#
# Quick demo (no API keys needed):
#   SEARCH_PROVIDER=stub LLM_MODE=demo docker compose up --build

services:

  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: itmaturity
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI application ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/itmaturity
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/itmaturity
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ARTIFACTS_DIR: /artifacts
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        playwright install chromium --with-deps 2>/dev/null || true &&
        uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Celery worker ─────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/itmaturity
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/itmaturity
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ARTIFACTS_DIR: /artifacts
    volumes:
      - artifacts:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        playwright install chromium --with-deps 2>/dev/null || true &&
        celery -A backend.tasks.celery_app worker
          --loglevel=info
          --queues=assessments
          --concurrency=2
      "

  # ── Celery Flower (monitoring, optional) ──────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker
    command: >
      celery -A backend.tasks.celery_app flower --port=5555
    profiles:
      - monitoring   # only start with: docker compose --profile monitoring up

volumes:
  postgres_data:
  artifacts:
